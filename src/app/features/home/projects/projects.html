<section class="section" id="projects">
  <div class="container">
    <app-section-header index="D" title="Key Products" drawingNo="AP-004" scale="1:1" subtitle="Enterprise systems built and maintained across an 18-year tenure." />

    <div class="projects__grid">
      @for (project of projects; track project.name; let i = $index) {
        <article class="project-card">
          <div class="project-card__head">
            <span class="mono project-card__index">P.{{ (i + 1).toString().padStart(2, '0') }}</span>
            @if (project.link) {
              <a [href]="project.link" target="_blank" rel="noopener noreferrer" class="project-card__link mono" aria-label="Open {{ project.name }}">↗</a>
            }
          </div>
          <h3 class="project-card__name">{{ project.name }}</h3>
          <p class="project-card__desc">{{ project.description }}</p>
          <ul class="project-card__tags">
            @for (tag of project.tags; track tag) {
              <li class="mono">{{ tag }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
